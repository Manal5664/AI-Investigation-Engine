{% extends "base.html" %}
{% block title %}{{ error_code }} · EvidenceAI{% endblock %}
{% block content %}

<div class="row justify-content-center py-5">
  <div class="col-lg-6 text-center">
    <div class="display-5 fw-bold text-body-secondary mb-2">{{ error_code }}</div>
    <h1 class="h4 mb-2">{{ error_title }}</h1>
    <p class="text-body-secondary mb-4">{{ error_message }}</p>
    <a href="/dashboard" class="btn btn-primary">
      <i class="bi bi-speedometer2 me-1"></i> Back to dashboard
    </a>
  </div>
</div>

{% endblock %}
