<header class="ai-topbar">
  <button type="button" class="ai-icon-btn d-lg-none" id="sidebarToggle" aria-label="Toggle navigation">
    <i class="bi bi-list" aria-hidden="true"></i>
  </button>
  <div class="ai-topbar-title">
    <h1>{% block page_title %}Workspace{% endblock %}</h1>
    <p>{% block page_subtitle %}{% endblock %}</p>
  </div>
  <div class="ai-topbar-actions">
    {% block topbar_actions %}{% endblock %}
    <a href="/investigate" class="btn btn-ai-primary btn-sm tw-rounded-xl">
      <i class="bi bi-plus-lg" aria-hidden="true"></i> New Investigation
    </a>
  </div>
</header>
