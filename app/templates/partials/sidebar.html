<aside class="ai-sidebar" id="aiSidebar" aria-label="Primary">
  <div class="ai-sidebar-brand">
    <span class="ai-logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
        <circle cx="16" cy="16" r="14" fill="url(#lg1)" />
        <path d="M11 20 L16 9 L21 20 Z" fill="#fff" />
        <circle cx="16" cy="22.5" r="2.4" fill="#fcd34d" />
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop stop-color="#6366f1" />
            <stop offset="1" stop-color="#312e81" />
          </linearGradient>
        </defs>
      </svg>
    </span>
    <span class="ai-sidebar-brand-text">
      <strong>EvidenceAI</strong>
      <small>Investigation &amp; Evidence Intelligence</small>
    </span>
  </div>

  <nav class="ai-nav">
    <p class="ai-nav-label">Workspace</p>
    <a class="ai-nav-item {% if nav_active == 'dashboard' %}active{% endif %}" href="/dashboard">
      <i class="bi bi-speedometer2" aria-hidden="true"></i><span>Dashboard</span>
    </a>
    <a class="ai-nav-item {% if nav_active == 'investigate' %}active{% endif %}" href="/investigate">
      <i class="bi bi-search-heart" aria-hidden="true"></i><span>New Investigation</span>
    </a>
    <a class="ai-nav-item {% if nav_active == 'documents' %}active{% endif %}" href="/documents-ui">
      <i class="bi bi-file-earmark-text" aria-hidden="true"></i><span>Documents</span>
    </a>
    <a class="ai-nav-item {% if nav_active == 'history' %}active{% endif %}" href="/history">
      <i class="bi bi-clock-history" aria-hidden="true"></i><span>Investigation History</span>
    </a>
    <a class="ai-nav-item {% if nav_active == 'rag' %}active{% endif %}" href="/rag-search">
      <i class="bi bi-robot" aria-hidden="true"></i><span>RAG Search</span>
    </a>
    <a class="ai-nav-item {% if nav_active == 'graph' %}active{% endif %}" href="/graph">
      <i class="bi bi-diagram-3" aria-hidden="true"></i><span>Evidence Graph</span>
    </a>

    <p class="ai-nav-label mt-4">Insights</p>
    <a class="ai-nav-item {% if nav_active == 'status' %}active{% endif %}" href="/dashboard#system-status">
      <i class="bi bi-activity" aria-hidden="true"></i><span>System Status</span>
    </a>
  </nav>

  <div class="ai-sidebar-footer">
    <div class="ai-version">v{{ app_version }}</div>
    <button type="button" class="ai-theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <i class="bi bi-moon-stars" aria-hidden="true"></i>
    </button>
  </div>
</aside>
