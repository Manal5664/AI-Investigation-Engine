{% extends "base.html" %}
{% block title %}History · EvidenceAI{% endblock %}
{% block content %}

<div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
  <div>
    <h1 class="h3 mb-1">History</h1>
    <p class="text-body-secondary mb-0">Past investigations and their outcomes.</p>
  </div>
  <a href="/investigate" class="btn btn-primary">
    <i class="bi bi-plus-lg me-1"></i> New case
  </a>
</div>

<div id="historyError" class="alert alert-danger d-none"></div>

<div class="ai-history-toolbar mb-3">
  <div class="input-group ai-search-form">
    <span class="input-group-text ai-search-icon"><i class="bi bi-search"></i></span>
    <input
      type="search"
      class="form-control"
      id="historyFilter"
      placeholder="Filter by query…"
      aria-label="Filter investigations by query"
    />
  </div>
  <select class="form-select form-select-sm ai-filter-select" id="historyStatus" aria-label="Filter by status">
    <option value="">All statuses</option>
    <option value="completed">Completed</option>
    <option value="partial">Partial</option>
    <option value="failed">Failed</option>
  </select>
</div>

<div class="card ai-card">
  <div class="table-responsive ai-table">
    <table class="table table-hover align-middle mb-0">
      <thead>
        <tr>
          <th>Query</th>
          <th>Depth</th>
          <th>Status</th>
          <th>Confidence</th>
          <th>Sources</th>
          <th>Evidence</th>
          <th>Created</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr>
          <td colspan="8" class="text-center text-body-secondary py-4">Loading…</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="/static/js/history.js"></script>
{% endblock %}
